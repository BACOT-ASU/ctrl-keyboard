name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk CtrlKeyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CtrlKeyboard-apk
          path: CtrlKeyboard.apk
      - name: Publish to Releases (tag "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CtrlKeyboard.apk \
            --title "Ctrl Keyboard (build ${{ github.run_number }})" \
            --notes "APK terbaru dari commit ${{ github.sha }}. Unduh CtrlKeyboard.apk lalu instal."
