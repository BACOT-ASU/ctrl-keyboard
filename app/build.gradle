plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bacad.ctrlkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bacad.ctrlkeyboard'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        shared {
            storeFile file('ctrlkb.keystore')
            storePassword 'ctrlkb123'
            keyAlias 'ctrlkb'
            keyPassword 'ctrlkb123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
